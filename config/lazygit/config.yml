gui:
  theme:
    selectedLineBgColor:
      - '#d7d7af'
  showFileTree: false
  enlargedSideViewLocation: top
git:
  log:
    showGraph: 'never'
    order: 'date-order'
  diffRenderers:
    - colorArg: always
      #pager: delta --navigate
      command: delta --paging=never
keybinding:
  universal:
    scrollUpMain: k
    scrollDownMain: j
    prevItem-alt: K
    nextItem-alt: J
    prevPage: <pgup>
    nextPage: <pgdown>
    nextScreenMode: ','
    prevScreenMode: .
    gotoTop: <home>
    gotoBottom: <end>
